openapi: 3.0.3
info:
  title: Brain API
  version: 0.1.0-draft
  description: |
    Two-plane memory service implementing the approved Portrait Card Spec.

    - **Privileged plane** — `adminAuth` (project token): CRUD, proposals, import/export, audit.
      Consumers: web-ui admin panel (family/company administrator) and internal system bots (role `system`).
    - **Query plane** — `contextAuth` (context token) + `X-Brain-Principal`: context assembly.
      Consumers: butler-bot (messengers), brain-mcp (LLM chat clients), web-ui user views.

    The brain returns **structured context blocks** — never natural-language answers (FR-025).
    Deterministic assembly; the brain never calls an LLM (I10); fail-closed everywhere (D2).

    Cross-repo source for SDKs and openapi-diff CI. The brain also serves this contract at `/openapi.json` (FR-022).
servers:
  - url: /v1

paths:
  /projects:
    post:
      summary: Create a project (the first act; before principals and data exist)
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created; tokens are returned once (stored hashed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTokens' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: Project info
      operationId: getProject
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectInfo' }
    patch:
      summary: Update project (name, charter, roles vocabulary config)
      operationId: patchProject
      security: [ { adminAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
      responses:
        '200': { description: Updated }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete the whole project (D7 — cascades all rows; audit is retained)
      operationId: deleteProject
      security: [ { adminAuth: [] } ]
      responses:
        '204': { description: Deleted }

  /projects/{projectId}/import:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    post:
      summary: Import a full portrait-card project file (single transaction, all-or-nothing; FR-023)
      operationId: importProject
      security: [ { adminAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortraitProject' }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards: { type: integer }
                  facts: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/export:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: Export the full project as portrait-card JSON (FR-021, D7)
      operationId: exportProject
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: Portrait-card project file (validates against schema/project.schema.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortraitProject' }

  /projects/{projectId}/principals:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: List principals
      operationId: listPrincipals
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Principal' }
    post:
      summary: Register a principal
      operationId: createPrincipal
      security: [ { adminAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Principal' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/roles:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: List roles (name → members)
      operationId: listRoles
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
    post:
      summary: Create/replace a role
      operationId: putRole
      security: [ { adminAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '201': { description: Created }

  /projects/{projectId}/groups:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: List groups
      operationId: listGroups
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
    post:
      summary: Create a group
      operationId: createGroup
      security: [ { adminAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        '201': { description: Created }

  /projects/{projectId}/cards:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: List cards (optional ?q= name/alias search)
      operationId: listCards
      security: [ { adminAuth: [] } ]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }
    post:
      summary: Create a card
      operationId: createCard
      security: [ { adminAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Card' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/cards/{slug}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a card with its facts
      operationId: getCard
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update card (name/aliases/defaults)
      operationId: patchCard
      security: [ { adminAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Card' }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete a card (cascades its facts; recorded in audit)
      operationId: deleteCard
      security: [ { adminAuth: [] } ]
      responses:
        '204': { description: Deleted }

  /projects/{projectId}/cards/{slug}/facts:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: List facts of a card (all statuses; ?status= filter)
      operationId: listFacts
      security: [ { adminAuth: [] } ]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FactStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Fact' }
    post:
      summary: Add a fact (no source → pending, FR-006)
      operationId: createFact
      security: [ { adminAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Fact' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fact' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/facts/{factRef}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: factRef, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a fact
      operationId: getFact
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fact' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a fact (text/visibility/groups/…; correction-with-replacement per FR-008)
      operationId: patchFact
      security: [ { adminAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Fact' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fact' }
    delete:
      summary: Soft-delete a fact (status `deleted`, FR-008)
      operationId: deleteFact
      security: [ { adminAuth: [] } ]
      responses:
        '204': { description: Soft-deleted }

  /projects/{projectId}/proposals:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
    get:
      summary: List pending facts (FR-007)
      operationId: listProposals
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Fact' }

  /projects/{projectId}/proposals/{factRef}/confirm:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: factRef, in: path, required: true, schema: { type: string } }
    post:
      summary: Confirm a pending fact (FR-007)
      operationId: confirmProposal
      security: [ { adminAuth: [] } ]
      responses:
        '200': { description: Confirmed }

  /projects/{projectId}/proposals/{factRef}/reject:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: factRef, in: path, required: true, schema: { type: string } }
    post:
      summary: Reject a pending fact (kept; never re-proposed — FR-007/FR-010)
      operationId: rejectProposal
      security: [ { adminAuth: [] } ]
      responses:
        '200': { description: Rejected }

  /projects/{projectId}/audit:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: actor, in: query, schema: { type: string } }
      - { name: since, in: query, schema: { type: string, format: date-time } }
      - { name: kind, in: query, schema: { type: string } }
    get:
      summary: Audit log (assemblies and mutations; append-only)
      operationId: readAudit
      security: [ { adminAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }

  /projects/{projectId}/context:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { $ref: '#/components/parameters/principalHeader' }
    post:
      summary: Assemble a structured context block (the brain's only read op — never an answer, FR-025)
      description: |
        Deterministic assembly (FR-011…019): match cards → related facts via shared groups →
        visibility filter (fail-closed) → interpretation substitution → core marking → ranking →
        budget → structured block + audit. Unknown principal → fail-closed everyone-only block.
      operationId: assembleContext
      security: [ { contextAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextRequest' }
      responses:
        '200':
          description: Context block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextBlock' }
        '401': { description: Bad context token }

components:
  securitySchemes:
    adminAuth: { type: http, scheme: bearer, description: Project token (privileged plane) }
    contextAuth: { type: http, scheme: bearer, description: Context token (query plane) }
  parameters:
    projectId: { name: projectId, in: path, required: true, schema: { type: string } }
    principalHeader:
      name: X-Brain-Principal
      in: header
      required: true
      schema: { type: string }
      description: Principal slug resolved by the channel; unknown → fail-closed (FR-002)
  responses:
    ValidationError:
      description: Validation error (FR-005/FR-009/…)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ProjectCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    ProjectTokens:
      type: object
      required: [slug, admin_token, context_token]
      properties:
        slug: { type: string }
        admin_token: { type: string, description: Privileged plane token — shown once }
        context_token: { type: string, description: Query plane token — shown once }
    ProjectInfo:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    ProjectPatch:
      type: object
      properties:
        name: { type: string }
        charter: { type: string }
    Principal:
      type: object
      required: [slug]
      properties:
        slug: { type: string }
        attributes: { type: object, description: Client-facing configuration only }
        card: { type: string, description: Slug of this principal's own card }
    Role:
      type: object
      required: [name, members]
      properties:
        name: { type: string }
        members: { type: array, items: { type: string } }
    Visibility:
      oneOf:
        - type: object
          required: [mode]
          properties: { mode: { type: string, enum: [everyone] } }
        - type: object
          required: [mode]
          properties: { mode: { type: string, enum: [owner] } }
        - type: object
          required: [mode, role]
          properties: { mode: { type: string, enum: [role] }, role: { type: string } }
        - type: object
          required: [mode, principals]
          properties:
            mode: { type: string, enum: [list] }
            principals: { type: array, items: { type: string }, minItems: 1 }
    InterpretationRule:
      type: object
      required: [when]
      properties:
        when: { type: object }
        text: { type: string }
        directive: { type: string }
    DisclosureRule:
      type: object
      required: [until, then]
      properties:
        until: { type: string }
        then: { $ref: '#/components/schemas/Visibility' }
        meanwhile: { type: string }
        review: { type: string }
    Source:
      type: object
      required: [type, ref]
      properties:
        type: { type: string, description: document | message | note | observation | interview | conversation }
        ref: { type: string }
        date: { type: string, format: date }
        note: { type: string }
    FactStatus:
      type: string
      enum: [pending, confirmed, rejected, deleted]
    Fact:
      type: object
      required: [id, text, source, status]
      properties:
        id: { type: string, description: Unique in project; f_ prefix conventional }
        text: { type: string, minLength: 1 }
        author: { type: string }
        status: { $ref: '#/components/schemas/FactStatus' }
        source: { $ref: '#/components/schemas/Source' }
        time:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        revalidate: { type: string }
        groups: { type: array, items: { type: string } }
        visibility: { $ref: '#/components/schemas/Visibility' }
        core: { type: array, items: { type: string } }
        keys: { type: array, items: { type: string } }
        interpretation: { type: array, items: { $ref: '#/components/schemas/InterpretationRule' } }
        disclosure: { $ref: '#/components/schemas/DisclosureRule' }
        extensions: { type: object }
    Card:
      type: object
      required: [slug, type, name]
      properties:
        slug: { type: string }
        type: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        defaults: { type: object }
        facts: { type: array, items: { $ref: '#/components/schemas/Fact' } }
        extensions: { type: object }
    PortraitProject:
      type: object
      description: Full portrait-card project file (schema/project.schema.json)
      required: [spec, spec_version, project, principals, groups, cards]
      properties:
        spec: { type: string }
        spec_version: { type: string }
        project: { type: object }
        principals: { type: array, items: { type: object } }
        groups: { type: array, items: { type: string } }
        cards: { type: array, items: { type: object } }
        extensions: { type: object }
    ContextRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        intent_hint: { type: string, description: Group name hint (Q2) }
        budget_tokens: { type: integer, description: Context budget; default at deployment config }
        include_history: { type: boolean, description: Include ended facts flagged `ended` (FR-015) }
    ContextFact:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string, description: Original or substituted per interpretation (FR-013) }
        groups: { type: array, items: { type: string } }
        source_ref: { type: string }
        flags:
          type: array
          items: { type: string }
          description: core | ended | substituted | stale
    ContextAudit:
      type: object
      required: [included, excluded]
      properties:
        matched_cards: { type: array, items: { type: string } }
        included: { type: array, items: { type: string } }
        excluded:
          type: array
          items:
            type: object
            required: [fact, reason]
            properties:
              fact: { type: string }
              reason: { type: string, description: deny_role | deny_owner | deny_list | ended | cut_budget | ... }
        substitutions:
          type: array
          items:
            type: object
            required: [fact, used]
            properties:
              fact: { type: string }
              used: { type: string }
    ContextBlock:
      type: object
      required: [facts, audit]
      properties:
        facts: { type: array, items: { $ref: '#/components/schemas/ContextFact' } }
        notes: { type: array, items: { type: string }, description: meanwhile answers of embargoed facts (FR-016) }
        audit: { $ref: '#/components/schemas/ContextAudit' }
    AuditEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string, description: assembly | mutation | delete | inquiry | failed_auth }
        object: { type: string }
        details: { type: object }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        details: { type: object }
